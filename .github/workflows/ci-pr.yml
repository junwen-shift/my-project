name: CI Pipeline for PR
  
on:
  pull_request:
    branches: [ main ]

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: curl test
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/user/tokens/${{ secrets.API_PATH }}" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -d '{"hosts":["${{ vars.HOSTNAME }}"]}'
  check-changes:
    uses: ./.github/workflows/check-changes.yml
    secrets: inherit
  build-test:
    needs: [check-changes]
    uses: ./.github/workflows/build-java.yml
    secrets: inherit
  terraform-plan:
    needs: [check-changes]
    uses: ./.github/workflows/terraform-plan.yml
    secrets: inherit
  opa-validation:
    needs: [terraform-plan]
    uses: ./.github/workflows/opa-validation.yml
    secrets: inherit
  code-review:
    uses: ./.github/workflows/code-review.yml
    secrets: inherit
  auto-approve-merge:
    needs: [build-test, terraform-plan, opa-validation, code-review]
    uses: ./.github/workflows/auto-approve-merge.yml
    with:
      is_validated: ${{ needs.opa-validation.outputs.is_validated }}
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit
